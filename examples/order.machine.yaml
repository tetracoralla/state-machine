version: "0.1"
id: order-lifecycle
title: Order lifecycle
initial: pending

context:
  schema:
    amount:
      type: number
    paid:
      type: boolean
    payment_id:
      type: string
      required: false
  initial:
    amount: 128
    paid: false

events:
  PAYMENT_SUCCESS:
    fields:
      amount:
        type: number
      payment_id:
        type: string
  START_FULFILLMENT: {}
  CANCEL: {}
  SHIP: {}
  DELIVER: {}

guards:
  payment_amount_matches:
    description: The received amount equals the order amount.
  cancellation_allowed:
    description: The owning policy permits cancellation.

states:
  pending:
    title: Pending payment
    on:
      PAYMENT_SUCCESS:
        target: paid
        guard: payment_amount_matches
        assign:
          paid:
            kind: literal
            value: true
          payment_id:
            kind: event
            path: payment_id
        effects:
          - type: record_payment
            input:
              payment_id:
                kind: event
                path: payment_id
      CANCEL:
        target: cancelled
  paid:
    title: Paid
    on:
      START_FULFILLMENT:
        target: fulfilling
      CANCEL:
        target: cancelled
        guard: cancellation_allowed
  fulfilling:
    title: Fulfilling
    on:
      SHIP:
        target: shipped
  shipped:
    title: Shipped
    on:
      DELIVER:
        target: completed
  cancelled:
    title: Cancelled
    final: true
  completed:
    title: Completed
    final: true

